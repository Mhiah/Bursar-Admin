<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bursar Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0066FF;--navy:#0A1128;--soft:#EAF6FF;--line:#D9E4F0;--bad:#C62828}
html{zoom:.9}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--navy);font-family:Inter,system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:40px;font-weight:800;margin:0}h2{font-size:20px;font-weight:800;margin:0 0 16px}
.sub{margin:8px 0 28px}.note{background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:24px}.note.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.tiles.three{grid-template-columns:repeat(3,1fr)}.num small{font-size:14px;font-weight:600}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:24px}.tiles .card{margin:0}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0}.num{font-size:34px;font-weight:800;margin:6px 0 0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}.charts .card{margin:0;min-width:0}
.chart{display:flex;align-items:flex-end;gap:4px;height:170px}
.vchart{position:relative}.vchart svg{display:block;width:100%;height:auto;overflow:visible}.vchart text{font-size:11px;fill:var(--navy)}
.vchart .grid{stroke:var(--line);stroke-width:1}.vchart .line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round}
.vchart .dot{fill:var(--blue);stroke:#fff;stroke-width:2}.vchart .hit{fill:transparent;cursor:default}.vchart .hit:hover+.dot,.vchart .on{r:6}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px}
.bar .d{white-space:nowrap}.bar i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}a{color:var(--blue);text-decoration:none}
.foot{font-size:12px}
form{display:flex;gap:10px;flex-wrap:wrap;max-width:420px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}
[hidden]{display:none!important}
.upd{display:flex;justify-content:flex-end;margin:-12px 0 24px}#update{font-size:12px;padding:6px 14px;border-radius:8px}button:disabled{opacity:.6;cursor:default}
@media(max-width:640px){.charts{grid-template-columns:1fr}.tiles,.tiles.three{grid-template-columns:repeat(2,1fr)}.tiles.three .card:last-child{grid-column:1/-1}h1{font-size:32px}.bar .d{writing-mode:vertical-rl;transform:rotate(180deg)}}
</style>
</head>
<body>
<main>
  <h1>Bursar Admin</h1>
  <p class="sub">Everyone using Bursar, counted by the vaults made from the vault factory on Arc.</p>

  <form id="login" hidden>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Open</button>
  </form>
  <p id="note" class="note" hidden></p>

  <div id="dash" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="tiles three" id="volume"></div>
    <div class="upd"><button id="update">Update</button></div>
    <div class="charts">
      <div class="card"><h2>Vaults made each week</h2><div class="chart" id="chart"></div></div>
      <div class="card"><h2>Total volume each week</h2><div class="vchart" id="vchart"></div></div>
    </div>
    <div class="card"><h2>Every vault</h2><div class="wrap"><table>
      <thead><tr><th>Made</th><th>Owner</th><th>Vault</th></tr></thead><tbody id="rows"></tbody>
    </table></div></div>
    <p class="foot" id="foot"></p>
  </div>
</main>
<script>
// The Bursar vault factory on Arc mainnet. Every Bursar vault is made by it and logged as VaultCreated.
const FACTORY = "0x1d872c07c1935fe5e3a28a9df0690c2caf7b5709";
// It went live on 14 Oct 2026, so no vault is older than this.
const FACTORY_LIVE = Date.UTC(2026, 9, 14);
const EXPLORER = "https://explorer.arc.io";
// keccak256("VaultCreated(address,address,address)")
const VAULT_CREATED = "0x897c133dfbfe1f6239e98b4ffd7e4f6c86a62350a131a7a37790419f58af02f9";
// USDC on Arc (its ERC-20 side, 6 decimals). Money into and out of every vault is counted from its Transfer events.
const USDC = "0x3600000000000000000000000000000000000000";
// keccak256("Transfer(address,address,uint256)")
const TRANSFER = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
const CHUNK = 10000;
const AT_ONCE = 2;
// v3: also keeps volume by week for the graph, so older saved scans start again from the beginning.
const KEY = "bursar-admin-v3-" + FACTORY;
const DAY = 86400000;

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let password = store.get("bursar-admin-pw") || "";
const fresh = () => ({ scanned: null, vaults: [], moneyIn: "0", moneyOut: "0", weeks: {} });
let state = (() => { try { return JSON.parse(store.get(KEY)) || fresh(); } catch { return fresh(); } })();

class WrongPassword extends Error {}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// Arc's public server limits how fast it can be asked: when it says slow down, wait and try again.
async function rpc(method, params) {
  for (let attempt = 0; ; attempt++) {
    const r = await fetch("/api/rpc", { method: "POST", headers: { "content-type": "application/json", "x-admin-password": password }, body: JSON.stringify({ method, params }) });
    if (r.status === 401) throw new WrongPassword();
    const out = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    const msg = out.error ? (typeof out.error === "string" ? out.error : out.error.message) : null;
    if (!msg) return out.result;
    const limited = r.status === 429 || /rate|limit|too many/i.test(msg);
    if (!limited || attempt >= 8) throw new Error(msg);
    await wait(Math.min(30000, 1000 * 2 ** attempt));
  }
}
const hex = (n) => "0x" + n.toString(16);
const times = new Map();
const blockTime = async (n) => {
  if (!times.has(n)) times.set(n, Number((await rpc("eth_getBlockByNumber", [hex(n), false])).timestamp) * 1000);
  return times.get(n);
};

// The first block at or after the factory went live (block times only, which every Arc node keeps).
async function firstBlock(latest) {
  let lo = 0, hi = latest;
  while (lo < hi) {
    const mid = Math.floor((lo + hi) / 2);
    if ((await blockTime(mid)) >= FACTORY_LIVE) hi = mid; else lo = mid + 1;
  }
  return Math.max(0, lo - 1);
}

// USDC that moved into and out of the vaults between blocks a and b. Moves between two vaults count as neither.
async function volume(a, b) {
  const out = { in: 0n, out: 0n };
  if (!state.vaults.length) return out;
  const mine = new Set(state.vaults.map((v) => v.vault.toLowerCase()));
  const topic = (addr) => "0x" + addr.slice(2).toLowerCase().padStart(64, "0");
  const from = (t) => "0x" + t.slice(26).toLowerCase();
  const vaults = [...mine];
  for (let i = 0; i < vaults.length; i += 100) {
    const group = vaults.slice(i, i + 100).map(topic);
    const range = { address: USDC, fromBlock: hex(a), toBlock: hex(b) };
    const [ins, outs] = await Promise.all([
      rpc("eth_getLogs", [{ ...range, topics: [TRANSFER, null, group] }]),
      rpc("eth_getLogs", [{ ...range, topics: [TRANSFER, group] }]),
    ]);
    const counted = [...ins.filter((l) => !mine.has(from(l.topics[1]))).map((l) => ["in", l]), ...outs.filter((l) => !mine.has(from(l.topics[2]))).map((l) => ["out", l])];
    for (const [side, l] of counted) {
      const v = BigInt(l.data);
      out[side] += v;
      // Volume by the week it happened in, for the graph.
      const week = monday(await blockTime(Number(l.blockNumber)));
      state.weeks[week] = (BigInt(state.weeks[week] || "0") + v).toString();
    }
  }
  return out;
}

function note(text, bad) {
  $("note").textContent = text;
  $("note").className = "note" + (bad ? " bad" : "");
  $("note").hidden = !text;
}

let busy = false;
// Update can be pressed once every 5 minutes; the automatic update every 6 hours carries on regardless.
const COOLDOWN = 5 * 60000;
const nextManual = () => Number(store.get("bursar-admin-manual") || 0) + COOLDOWN;
function showButton() {
  if (!$("update")) return;
  const wait = nextManual() - Date.now();
  $("update").disabled = busy || wait > 0;
  $("update").title = wait > 0 ? `You can update again in ${Math.ceil(wait / 60000)} min` : "";
}
setInterval(showButton, 5000);
const setBusy = (b) => {
  busy = b;
  showButton();
};
async function scan() {
  if (busy) return;
  setBusy(true);
  try {
    const latest = Number(await rpc("eth_blockNumber", []));
    let from = state.scanned == null ? await firstBlock(latest) : state.scanned + 1;
    const total = latest - from + 1;
    while (from <= latest) {
      const ranges = [];
      for (let i = 0; i < AT_ONCE && from <= latest; i++) {
        ranges.push([from, Math.min(from + CHUNK - 1, latest)]);
        from += CHUNK;
      }
      const results = await Promise.all(ranges.map(([a, b]) => rpc("eth_getLogs", [{ address: FACTORY, topics: [VAULT_CREATED], fromBlock: hex(a), toBlock: hex(b) }])));
      for (const logs of results)
        for (const l of logs) {
          const vault = "0x" + l.topics[2].slice(26);
          if (state.vaults.some((v) => v.vault === vault)) continue;
          state.vaults.push({ vault, owner: "0x" + l.topics[1].slice(26), block: Number(l.blockNumber), time: await blockTime(Number(l.blockNumber)) });
        }
      // Vaults made in these blocks are known now, so their money in these same blocks is counted too.
      const moved = await Promise.all(ranges.map(([a, b]) => volume(a, b)));
      state.moneyIn = moved.reduce((s, m) => s + m.in, BigInt(state.moneyIn)).toString();
      state.moneyOut = moved.reduce((s, m) => s + m.out, BigInt(state.moneyOut)).toString();
      state.scanned = ranges[ranges.length - 1][1];
      store.set(KEY, JSON.stringify(state));
      if (total > CHUNK * AT_ONCE) note(`Reading Arc for every vault made so far… ${Math.min(100, Math.round(((total - (latest - from + 1)) / total) * 100))}%`);
      render();
    }
    state.checkedAt = Date.now();
    store.set(KEY, JSON.stringify(state));
    note("");
    render();
  } catch (e) {
    if (e instanceof WrongPassword) {
      password = "";
      store.del("bursar-admin-pw");
      showLogin("Wrong password.");
    } else {
      note(`Couldn't read Arc: ${e.message}. It will try again in a minute, carrying on from where it stopped.`, true);
      setTimeout(scan, 60000);
    }
  } finally {
    setBusy(false);
  }
}

// 6-decimal units to "1,234.56".
const usdc = (n) => (Number(n / 10000n) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;
const fmt = (t, o) => new Date(t).toLocaleDateString("en-GB", o);
const monday = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const link = (a) => `<a href="${EXPLORER}/address/${a}" target="_blank" rel="noopener">${short(a)}</a>`;

function render() {
  $("dash").hidden = false;
  const vaults = [...state.vaults].sort((a, b) => b.time - a.time);
  const now = Date.now();
  const tiles = [
    // Bursar allows one business per wallet, so each different owner is one business.
    ["Businesses", new Set(vaults.map((v) => v.owner)).size],
    ["Vaults made", vaults.length],
    ["Made this week", vaults.filter((v) => v.time >= monday(now)).length],
    ["Last 30 days", vaults.filter((v) => v.time >= now - 30 * DAY).length],
  ];
  $("tiles").innerHTML = tiles.map(([l, n]) => `<div class="card"><p class="label">${l}</p><p class="num">${n}</p></div>`).join("");
  const moneyIn = BigInt(state.moneyIn || "0"), moneyOut = BigInt(state.moneyOut || "0");
  $("volume").innerHTML = [["Money in", moneyIn], ["Money out", moneyOut], ["Total volume", moneyIn + moneyOut]]
    .map(([l, n], i) => `<div class="card"><p class="label">${l}</p><p class="num">${usdc(n)} <small>USDC</small></p></div>`).join("");
  showButton();
  const first = monday(now) - 11 * 7 * DAY;
  const weeks = Array.from({ length: 12 }, (_, i) => {
    const start = first + i * 7 * DAY;
    return { start, n: vaults.filter((v) => v.time >= start && v.time < start + 7 * DAY).length };
  });
  const top = Math.max(1, ...weeks.map((w) => w.n));
  // Every other date, so they fit side by side with the volume graph.
  $("chart").innerHTML = weeks.map((w, i) => `<div class="bar"><span>${w.n || ""}</span><i style="height:${(w.n / top) * 100}%"></i><span class="d">${i % 2 === 0 ? fmt(w.start, { day: "numeric", month: "short" }) : "&nbsp;"}</span></div>`).join("");
  volumeChart(weeks.map((w) => ({ start: w.start, v: Number(BigInt(state.weeks?.[w.start] || "0")) / 1e6 })));
  $("rows").innerHTML = vaults.length
    ? vaults.map((v) => `<tr><td>${fmt(v.time, { day: "numeric", month: "short", year: "numeric" })}</td><td>${link(v.owner)}</td><td>${link(v.vault)}</td></tr>`).join("")
    : `<tr><td colspan="3">No vaults found yet.</td></tr>`;
  $("foot").innerHTML = `Factory ${link(FACTORY)} · read up to block ${state.scanned ?? "…"} · updates every 6 hours`;
}

// 1500 -> "1.5k", 2000000 -> "2m".
const compact = (n) => (n >= 1e6 ? +(n / 1e6).toFixed(1) + "m" : n >= 1e3 ? +(n / 1e3).toFixed(1) + "k" : String(+n.toFixed(2)));
// A round top for the y-axis and the gap between its lines: 1, 2 or 5 times a power of ten.
function niceScale(max) {
  if (max <= 0) return { top: 4, step: 1 };
  const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map((m) => m * p).find((s) => s >= raw);
  return { top: Math.ceil(max / step) * step, step };
}
function volumeChart(points) {
  const W = 460, H = 200, L = 40, R = 10, T = 16, B = 26;
  const { top, step } = niceScale(Math.max(...points.map((p) => p.v)));
  const x = (i) => L + (i * (W - L - R)) / (points.length - 1);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total volume each week, in USDC">`;
  for (let v = 0; v <= top + 1e-9; v += step)
    svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  points.forEach((p, i) => {
    if (i % 2 === 0) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${fmt(p.start, { day: "numeric", month: "short" })}</text>`;
  });
  svg += `<path class="line" d="${points.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.v)}`).join(" ")}"/>`;
  const slot = (W - L - R) / (points.length - 1);
  points.forEach((p, i) => {
    svg += `<rect class="hit" data-i="${i}" x="${x(i) - slot / 2}" y="${T}" width="${slot}" height="${H - T - B}"/><circle class="dot" cx="${x(i)}" cy="${y(p.v)}" r="4"/>`;
  });
  svg += `</svg><div class="tip" hidden></div>`;
  const box = $("vchart");
  box.innerHTML = svg;
  const tip = box.querySelector(".tip");
  box.querySelectorAll(".hit").forEach((r) => {
    r.addEventListener("mouseenter", () => {
      const p = points[r.dataset.i], k = box.querySelector("svg").clientWidth / W;
      tip.textContent = `Week of ${fmt(p.start, { day: "numeric", month: "short" })}: ${p.v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USDC`;
      tip.style.left = x(+r.dataset.i) * k + "px";
      // Keep the label inside the box at both ends.
      const at = +r.dataset.i / (points.length - 1);
      tip.style.transform = `translate(${at > 0.66 ? "-100%" : at < 0.33 ? "0" : "-50%"}, -110%)`;
      tip.style.top = y(p.v) * k + "px";
      tip.hidden = false;
    });
    r.addEventListener("mouseleave", () => (tip.hidden = true));
  });
}

function showLogin(msg) {
  $("dash").hidden = true;
  $("login").hidden = false;
  note(msg || "", !!msg);
}
$("update").addEventListener("click", () => {
  if (busy || Date.now() < nextManual()) return;
  store.set("bursar-admin-manual", String(Date.now()));
  scan();
});
$("login").addEventListener("submit", (e) => {
  e.preventDefault();
  password = $("pw").value;
  store.set("bursar-admin-pw", password);
  $("login").hidden = true;
  note("");
  scan();
});

if (password) { render(); scan(); } else showLogin();
setInterval(() => password && scan(), 6 * 3600000);
</script>
</body>
</html>
